# Review decisions applied by `make curate` on top of the extracted facts
# (data/extracted/) and the hand-entered rows (data/curated/manual/).
# Edit this file, not the generated data/curated/*.csv tables.

# Entity ids that name the same holder: drop-id: keep-id
entity_aliases:
  samson-de-varsberg: house-varsberg        # Samson de Varsberg holds the Varsberg half of Anzeling (p. 52, 81)
  jean-wolf-schmittberg: house-braun-schmittberg  # Wolf (Braun) de Schmittberg bought half of Otzweiler (p. 79, 81)
  # The reigning duke acts for the duchy (convention from Stage 2).
  charles-iv-lorraine: duchy-lorraine
  charles-iii-lorraine: duchy-lorraine
  # Same family or house under different prefixes / spellings.
  house-eberstein: county-eberstein
  barons-braubach: house-braubach
  baron-braubach: house-braubach
  house-chateau-rouge: lords-chateau-rouge
  lords-felsberg: house-felsberg
  lords-varsberg: house-varsberg
  lords-kerpen: house-kerpen
  house-dalem: lords-dalem
  counts-hohensaxen: house-hohensaxen    # "le comte" (p. 15) and "le baron" (pp. 79-80) de Hohensaxen, holders of Berus
  county-morhange: rhingraves-kyrbourg     # "les comtes de Morhange": the rhingraves of Kyrburg (pp. 106-107)
  elisee-haraucourt: elisee-d-haraucourt    # Élisée d'Haraucourt (d'Acraignes), marquis of Faulquemont
  house-hattstein: gutta-de-hattstein    # "la dame de Hattstein" (p. 15) is the widow Gutta de Hattstein (p. 79)
  lords-hunolstein: house-hunolstein
  lords-reipoltzkirchen: house-reipoltzkirchen
  lords-helmstatt: house-helmstatt
  lords-levenstein: house-levenstein
  rhingraves: house-rhingraves
  rhinegraves-kyrbourg: rhingraves-kyrbourg
  thierry-de-schoenberg: house-schoenberg
  georges-jean-i-veldenz: georges-jean-veldenz
  marquise-de-havre: house-havre
  marquise-du-havre: house-havre
  house-faust: house-faust-stromberg
  house-stromberg: house-faust-stromberg
  house-hepchen: house-hepgen
  marzolf-de-braubach: martzloff-de-braubach
  # Religious houses under two names.
  chapter-saint-pierre-metz: abbey-saint-pierre-metz
  convent-saint-vincent-metz: abbey-saint-vincent-metz
  abbey-grauftal: abbey-graufthal
  commandery-bassel: commandery-saint-jean-de-bassel
  # Reviewed and kept apart: abbey-/lords-freistroff, chapter-/lords-fenetrange, county-/house-bitche,
  # house-leiningen-falkenburg/-hartenburg, house-daun/-dern/-hausen, house-morbach/-furbach/-braubach.

# Realms the book names both as a district of the bailiwick ("l'office de Forbach") and as a fief
# ("la seigneurie de Forbach"): two entries sharing their lands. A mention goes to one half by its
# wording (office, châtellenie / seigneurie, comté, terre, principauté), else by its extracted type.
# The fief holds the lord's rights and lies in its office; the office holds the bailiwick's rights
# (aids, musters, notaries, appeals) and sits in the bailiwick (curate/build.py split_*).
split_realms:
  Forbach:     {admin: office-forbach, admin_type: office, feudal: lordship-forbach, feudal_type: lordship}
  Puttelange:  {admin: office-puttelange, admin_type: office, feudal: lordship-puttelange, feudal_type: lordship}
  Morhange:    {admin: office-morhange, admin_type: office, feudal: lordship-morhange, feudal_type: lordship}
  Faulquemont: {admin: office-faulquemont, admin_type: office, feudal: lordship-faulquemont, feudal_type: lordship}
  Boulay:      {admin: office-boulay, admin_type: office, feudal: county-boulay, feudal_type: county}
  Berus:       {admin: office-berus, admin_type: office, feudal: lordship-berus, feudal_type: lordship}
  Sarralbe:    {admin: office-sarralbe, admin_type: office, feudal: lordship-sarralbe, feudal_type: lordship}
  Phalsbourg:  {admin: office-phalsbourg, admin_type: office, feudal: principality-phalsbourg, feudal_type: principality}

# What a place is, where the book says so (place id -> place type)
place_types:
  # "avec la saline" (p. 18), the saline of Salzbronn (p. 141); "Silzheim (Sulzen, saline)" (p. 19)
  saltzbronn: saltworks
  silzheim: saltworks
  # new villages: "nouveau village" (pp. 17, 19, 27, 50-51, 64), "futur village" of the 1585 lists
  # (pp. 64, 114), founded by Louis de Guise in 1628-29 (p. 29)
  redlach: new_village
  montdidier: new_village
  bickenholz: new_village
  calembourg: new_village
  hanfgarten: new_village
  neudorf: new_village
  remelfing-sierck: new_village
  lacroix: new_village
  rodlach: new_village
  sainte-marguerite: new_village
  merlebach: new_village
  henriville: new_village
  lachambre: new_village
  porcelette: new_village
  henridorf: new_village
  # "le ban du village disparu de Bletting" (p. 62)
  bletting: deserted_village
  # fiefs in the book, but as places a castle ("le château de Busbach", p. 98) and villages
  busbach: castle
  assviller: village
  ayol: village
  diedendorf: village
  pommern: village
  struth: village

# Place names as written in the book -> place id (fixes OCR variants, duplicate territories)
place_aliases:
  office de Phalsbourg-Danne: office-phalsbourg
  bailliage de Phalsbourg: office-phalsbourg
  châtellenie de Sarreguemines: castellany-sarreguemines   # the 21 places of p. 17, within the office
  office de Sarreguemines: office-sarreguemines
  "territory: Sarreguemines": office-sarreguemines
  # The office of Sierck: "prévôté et sous-prévôté de Sierck, grande prévôté ou prévôté rurale, prévôté de
  # Condé et cour de Perl" (p. 49; lists p. 12-13).
  prévôté de Sierck: provostship-sierck
  sous-prévôté de Sierck: provostship-sous-sierck
  "territory: Sierck": office-sierck
  office de Sierck: office-sierck
  prévôté de Condé: court-conde                     # the cour de Condé of p. 13
  "territory: Condé": court-conde
  "territory: Marsal": castellany-marsal
  # The office of Dieuze: the castellany of Dieuze (31 places, p. 20) and that of Marimont, joined to it.
  châtellenie de Dieuze: castellany-dieuze
  office de Dieuze: office-dieuze
  "territory: Dieuze": office-dieuze
  prévôté de Marsal: castellany-marsal              # same places as the castellany (p. 20, 76)
  prévôté d'Oberkirchen: provostship-ketternostern  # Oberkirchen = Catherinenostern / Ketternostern (p. 15)      # the Veldenz bailliage, sold to Lorraine in 1583 (p. 113-114)
  # Varsberg and Lemberg are lordships only: "l'office de Varsberg" is the lordship within the office of
  # Boulay (pp. 16, 82); "l'office de Lemberg" was an office of the county of Bitche, ceded in 1606 (p. 105).
  office de Varsberg: lordship-varsberg
  seigneurie de Varsberg: lordship-varsberg
  la terre de Varsberg: lordship-varsberg
  "territory: Varsberg": lordship-varsberg
  office de Lemberg-lès-Pirmasens: lordship-lemberg-les-pirmasens
  "territory: Lemberg-lès-Pirmasens": lordship-lemberg-les-pirmasens
  duché de Lorraine: duchy-lorraine         # a state, not a territory: memberships in it are dropped
  bailliage: bailliage-allemagne            # "le bailliage" in the book is always the bailliage d'Allemagne
  bailliage d'Allemagne: bailliage-allemagne
  # Hombourg-Haut / Saint-Avold: one office (episcopal castellany until 1581) under many names.
  Hombourg: office-hombourg-haut
  Hombourg-Haut: office-hombourg-haut
  Hombourg et Saint-Avold: office-hombourg-haut
  office de Hombourg: office-hombourg-haut
  office de Hombourg-Haut: office-hombourg-haut
  office de Hombourg et Saint-Avold: office-hombourg-haut
  office de Hombourg-Saint-Avold: office-hombourg-haut
  # The vouerie of Saint-Nabor (Saint-Avold's old name) is one district: the lands of the abbey of
  # Saint-Avold, with the Nassau as advocates since 1302 and Lorraine as lord from 1581; also called the
  # grande cour or mère-cour of Hombourg and Saint-Avold, and the seigneurie of Saint-Avold (pp. 64, 66,
  # 78, 84, 86, 100-102)
  vouerie de Saint-Nabor: advocacy-saint-avold
  vouerie de Hombourg-Saint-Avold: advocacy-saint-avold
  "territory: Saint-Avold": advocacy-saint-avold
  la châtellenie de Hombourg-Haut: office-hombourg-haut
  châtellenie épiscopale de Hombourg-Haut: office-hombourg-haut
  seigneurie de Hombourg: office-hombourg-haut
  # Hombourg-sur-Canner (Hombourg-Budange), a fief of the Créhange in the office of Sierck (p. 50, 81).
  la terre de Hombourg: lordship-hombourg-sur-canner
  seigneurie de Hombourg-sur-Canner: lordship-hombourg-sur-canner
  "L1-C06-S09: Hombourg": lordship-hombourg-sur-canner
  # The Merzig-Saargau condominium under its spellings (its halves stay: saargau, office-merzig).
  Merzig-Saargau: condominium-merzig-saargau
  Saargau-Merzig: condominium-merzig-saargau
  Saargau et Merzig: condominium-merzig-saargau
  Pitche: county-bitche                      # OCR slip for Bitche
  "territory: Marimont-lès-Albestroff": lordship-marimont   # the village of that name stays a village
  "L1-C06-S09: Rehlingen": rehlingen-sur-sarre   # a Siersberg fief (p. 82), not Dehlingen in Alsace
  office de Sarrebourg: provostship-sarrebourg
  "L1-C06-S06: Helling": hoelling   # the Helling of the sergenterie de Rimling (pp. 69-70) is Hœlling near Bettviller
  "L1-C08-S07: Steinbach": steinbach-audviller   # Kingertal's Steinbach (p. 116) is the val de Guéblange's (p. 78)
  "L1-C06-S08: Rode": rode-morhange              # "Rode" of the old castellany of Marimont (p. 74) = Rode-lès-Morhange (p. 20)
  grande prévôté: provostship-rurale-de-sierck   # "grande prévôté ou prévôté rurale" of the office of Sierck (p. 49)
  "territory: Sarrebourg": provostship-sarrebourg   # the "Sarrebourg" of the bailiwick's units (pp. 9, 22) is the prévôté of p. 19
  # One place recorded twice under two names.
  Prieuré de Hesse: hesse                         # the Haute-Seille priory at Hesse (pp. 19, 76)
  Moyenvic ou Petit-Vic: moyenvic
  Lascemborn: lafrimbolle                         # index: Lascemhorn = Lafrimbolle
  Rémeling: remelfing-sierck                      # index: Remelfing (Sierck), pp. 12, 49-50, 80-81
  "L1-C06-S06: Schweix": schweix-pirmasens        # Schweix of the mairie of Walschbronn (p. 69), near Pirmasens
  "L1-C08-S07: Schweix": schweix-gueblange-les-sarralbe   # Kingertal's Schweix (p. 116) is the val de Guéblange's (p. 78)
  Hombourg-village: hombourg-haut-et-bas          # the village of Hombourg (p. 16) is Hombourg-Bas (p. 64)
  "L1-C01-S07: Chémery": chemery-faulquemont     # the Chémery of Faulquemont's list (p. 16), not Sierck's Chémery-les-Deux
  "L1-C01-S07: Ebersviller": petit-ebersviller    # Hombourg's Ebersviller (p. 16) is Petit-Ebersviller, not the one near Bouzonville
  "L1-C01-S07: Hellering": hellering-hombourg-haut   # Hombourg's Hellering (p. 16), not Hellering near Fénétrange
  "L1-C06-S05: Hellering": hellering-hombourg-haut   # a fief of the office of Hombourg (p. 64)
  # One realm recorded twice: the lordship of Lemberg (county of Bitche, pp. 18, 104-106) and the county of
  # La Petite-Pierre (Lützelstein, pp. 104-106, 113-114).
  seigneurie de Lemberg: lordship-lemberg-les-pirmasens
  terre de Lemberg: lordship-lemberg-les-pirmasens
  "territory: Lemberg": lordship-lemberg-les-pirmasens
  château et seigneurie de Lemberg-lès-Pirmasens: lordship-lemberg-les-pirmasens   # p. 69
  bailliage de Vic: bailiwick-episcopal-de-vic       # the bishop of Metz's bailiwick (p. 78); OCR also "Vie"
  bailliage de Vie: bailiwick-episcopal-de-vic
  county-la-petite-pierre: county-petite-pierre
  comté de la Petite-Pierre (Veldenz): county-petite-pierre
  comté impérial de la Petite-Pierre: county-petite-pierre
  "territory: La Petite-Pierre": county-petite-pierre
  "territory: Petite-Pierre": county-petite-pierre


  # Parts of Bitche the databases matched to Alsatian namesakes.
  kaltenhausen: {approximate: bitche, note: "Kaltenhausen, the lower town at the foot of Bitche castle (p. 17); was matched to Kaltenhouse near Haguenau"}
  rohr: {approximate: bitche, note: "Rohr alias Roseau with the Faubourg of Bitche (p. 17); was matched to Rohr in Bas-Rhin"}
  dehlingen: {wikidata: Q21230, lat: 48.98111, lon: 7.19167, name_de: Dehlingen, name_en: Dehlingen,
              note: "Dehlingen in the lordship of Diemeringen (p. 106); the Siersberg fief Rehlingen (p. 82) had been merged into it"}
  rehlingen-sur-moselle: {wikidata: Q106619185, lat: 49.62321, lon: 6.4301, name_de: Rehlingen (Nittel), name_en: Rehlingen (Nittel),
                          note: "Rehlingen by Nittel on the Moselle (p. 13; index: canton of Saarburg); was matched to Rehlingen-Siersburg on the Saar"}
  remering-puttelange: {wikidata: Q22334, lat: 49.03556, lon: 6.93944, name_de: Rémering-lès-Puttelange, name_en: Rémering-lès-Puttelange,
                        note: "Rémering of the lordship of Puttelange (p. 17); the index's department was misread, so it went unplaced"}

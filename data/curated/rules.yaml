# Review decisions applied by `make curate` on top of the extracted facts
# (data/extracted/) and the hand-entered rows (data/curated/manual/).
# Edit this file, not the generated data/curated/*.csv tables.

# Entity ids that name the same holder: drop-id: keep-id
entity_aliases:
  samson-de-varsberg: house-varsberg        # Samson de Varsberg holds the Varsberg half of Anzeling (p. 52, 81)
  jean-wolf-schmittberg: house-braun-schmittberg  # Wolf (Braun) de Schmittberg bought half of Otzweiler (p. 79, 81)
  # The reigning duke acts for the duchy (convention from Stage 2).
  charles-iv-lorraine: duchy-lorraine
  charles-iii-lorraine: duchy-lorraine
  # Same family or house under different prefixes / spellings.
  house-eberstein: county-eberstein
  barons-braubach: house-braubach
  baron-braubach: house-braubach
  house-chateau-rouge: lords-chateau-rouge
  lords-felsberg: house-felsberg
  lords-varsberg: house-varsberg
  lords-kerpen: house-kerpen
  house-dalem: lords-dalem
  counts-hohensaxen: house-hohensaxen    # "le comte" (p. 15) and "le baron" (pp. 79-80) de Hohensaxen, holders of Berus
  house-hattstein: gutta-de-hattstein    # "la dame de Hattstein" (p. 15) is the widow Gutta de Hattstein (p. 79)
  lords-hunolstein: house-hunolstein
  lords-reipoltzkirchen: house-reipoltzkirchen
  lords-helmstatt: house-helmstatt
  lords-levenstein: house-levenstein
  rhingraves: house-rhingraves
  rhinegraves-kyrbourg: rhingraves-kyrbourg
  thierry-de-schoenberg: house-schoenberg
  georges-jean-i-veldenz: georges-jean-veldenz
  marquise-de-havre: house-havre
  marquise-du-havre: house-havre
  house-faust: house-faust-stromberg
  house-stromberg: house-faust-stromberg
  house-hepchen: house-hepgen
  marzolf-de-braubach: martzloff-de-braubach
  # Religious houses under two names.
  chapter-saint-pierre-metz: abbey-saint-pierre-metz
  convent-saint-vincent-metz: abbey-saint-vincent-metz
  abbey-grauftal: abbey-graufthal
  commandery-bassel: commandery-saint-jean-de-bassel
  # Reviewed and kept apart: abbey-/lords-freistroff, chapter-/lords-fenetrange, county-/house-bitche,
  # house-leiningen-falkenburg/-hartenburg, house-daun/-dern/-hausen, house-morbach/-furbach/-braubach.

# Place names as written in the book -> place id (fixes OCR variants, duplicate territories)
place_aliases:
  duché de Lorraine: duchy-lorraine         # a state, not a territory: memberships in it are dropped
  bailliage: bailliage-allemagne            # "le bailliage" in the book is always the bailliage d'Allemagne
  bailliage d'Allemagne: bailliage-allemagne
  # Hombourg-Haut / Saint-Avold: one office (episcopal castellany until 1581) under many names.
  Hombourg: office-hombourg-haut
  Hombourg-Haut: office-hombourg-haut
  Hombourg et Saint-Avold: office-hombourg-haut
  office de Hombourg: office-hombourg-haut
  office de Hombourg-Haut: office-hombourg-haut
  office de Hombourg et Saint-Avold: office-hombourg-haut
  office de Hombourg-Saint-Avold: office-hombourg-haut
  la châtellenie de Hombourg-Haut: office-hombourg-haut
  châtellenie épiscopale de Hombourg-Haut: office-hombourg-haut
  seigneurie de Hombourg: office-hombourg-haut
  # Hombourg-sur-Canner (Hombourg-Budange), a fief of the Créhange in the office of Sierck (p. 50, 81).
  la terre de Hombourg: lordship-hombourg-sur-canner
  seigneurie de Hombourg-sur-Canner: lordship-hombourg-sur-canner
  "L1-C06-S09: Hombourg": lordship-hombourg-sur-canner
  # The Merzig-Saargau condominium under its spellings (its halves stay: saargau, office-merzig).
  Merzig-Saargau: condominium-merzig-saargau
  Saargau-Merzig: condominium-merzig-saargau
  Saargau et Merzig: condominium-merzig-saargau
  Pitche: county-bitche                      # OCR slip for Bitche
  "territory: Marimont-lès-Albestroff": lordship-marimont   # the village of that name stays a village
  "L1-C06-S09: Rehlingen": rehlingen-sur-sarre   # a Siersberg fief (p. 82), not Dehlingen in Alsace
  office de Sarrebourg: provostship-sarrebourg
  "L1-C06-S06: Helling": hoelling   # the Helling of the sergenterie de Rimling (pp. 69-70) is Hœlling near Bettviller
  "L1-C08-S07: Steinbach": steinbach-audviller   # Kingertal's Steinbach (p. 116) is the val de Guéblange's (p. 78)
  "L1-C06-S08: Rode": rode-morhange              # "Rode" of the old castellany of Marimont (p. 74) = Rode-lès-Morhange (p. 20)
  grande prévôté: provostship-rurale-de-sierck   # "grande prévôté ou prévôté rurale" of the office of Sierck (p. 49)
  "territory: Sarrebourg": provostship-sarrebourg   # the "Sarrebourg" of the bailiwick's units (pp. 9, 22) is the prévôté of p. 19

# Name/type corrections for generated entities: id: {name_en: ..., name_fr: ..., name_de: ..., entity_type: ...}
entities:
  house-hohensaxen: {name_en: House of Hohensax, name_fr: Maison de Hohensaxen, name_de: Haus Hohensax}
  gutta-de-hattstein: {name_en: "Gutta of Hattstein, widow", name_fr: "Gutta de Hattstein, veuve",
                       name_de: "Gutta von Hattstein, Witwe", entity_type: person}

# Extracted rights to discard; every given field must match (place, right_type, holder, status, ...)
drop_rights:
  - {place: arriance, right_type: manorial_lord, holder: house-varsberg,
     reason: "the Varsberg half was pledged to Godron Duchat (p. 147); the pledge row holds it"}

# Extracted memberships to discard; every given field must match (child, parent)
drop_memberships:
  - {child: gauhiving, parent: advocacy-saint-nabor, reason: "in the vouerie only in 1365 and c.1429 (p. 67); a Landmairie of Forbach in 1623"}
  - {child: ditschviller, parent: advocacy-saint-nabor, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: emmersweiler, parent: advocacy-saint-nabor, reason: "in the vouerie only in 1365 and c.1429 (p. 67)"}
  - {child: guerting, parent: advocacy-saint-nabor, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: remsing, parent: advocacy-saint-nabor, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: sarreinsming, parent: lordship-forbach,
     reason: "only its castle is a rear-fief held of Forbach (p. 82); the village is a fief of the Sarreguemines castellany (p. 17)"}
  - {parent: ban-westrich,
     reason: "the Westrich of Münster's 1552 Cosmographia (p. 10) is a loose region, not a realm"}
  - {child: dordhal, parent: lordship-bourgaltroff,
     reason: "only formerly part of Bourgaltroff; a fief contested between Lorraine and the bishopric from 1577 (p. 146)"}

# Corrections to extracted rights: rows matching every `match` field get the `set` fields.
right_overrides:
  - match: {place: berus, right_type: manorial_lord, holder: county-sulz}
    set: {share: "1/4"}
    reason: "Sulz and Anholt share one half through their wives, the Metternich the other (p. 80)"
  - match: {place: berus, right_type: manorial_lord, holder: county-anholt}
    set: {share: "1/4"}
    reason: "Sulz and Anholt share one half through their wives, the Metternich the other (p. 80)"
  - match: {place: ban-otzweiler, right_type: manorial_lord, holder: philippe-de-forbach}
    set: {to_year: 1613, to_precision: before}
    reason: "Philippe de Forbach sold his half to Wolf de Schmittberg, who holds it in 1613 (p. 79, 81)"
  - match: {place: creutzwald, right_type: middle_low_justice}
    set: {share: joint}
    reason: "the book gives 1/3, 1/3 and 1/2 (p. 80); shares kept as joint"


# Extracted rights to discard; every given field must match (place, right_type, holder, status, ...)
drop_rights:
  - {place: arriance, right_type: manorial_lord, holder: house-varsberg,
     reason: "the Varsberg half was pledged to Godron Duchat (p. 147); the pledge row holds it"}
  - {place: county-petite-pierre, right_type: manorial_lord, holder: house-rhingraves-wildgraves,
     reason: "p. 124 lists La Petite-Pierre among the rhingraves' lands by an oversight: the county was the counts palatine of Veldenz' (pp. 104-106, 113)"}
  - {place: berus, right_type: manorial_lord, holder: house-braun-schmittberg,
     reason: "the 1630 list gives Jean-Wolf de Schmittberg houses, farms and lands at Berus, not the lordship (p. 80)"}
  - {place: volkrange, right_type: manorial_lord, holder: house-braun-schmittberg,
     reason: "the 1613 list gives Jean-Wolf de Schmittberg a house at Volkrange, not the village (p. 80)"}
  - {place: grosshemmersdorf, right_type: manorial_lord, holder: house-felsberg,
     reason: "p. 50 gives Heckling to the house of Felsberg; Hemmersdorf and Itzbach end the list of the count of Sayn's men"}
  - {place: itzbach, right_type: manorial_lord, holder: house-felsberg,
     reason: "p. 50 gives Heckling to the house of Felsberg; Hemmersdorf and Itzbach end the list of the count of Sayn's men"}
  - {place: kerprich-hemmersdorf, right_type: manorial_lord, holder: house-zandt,
     reason: "the fief is a house at Hemmersdorf-sur-Nied, not the village (p. 82)"}
  - {place: kerprich-hemmersdorf, right_type: manorial_lord, holder: house-braunsdorf,
     reason: "the fief is a farm (cense) at Hemmersdorf, not the village (p. 82)"}
  - {place: kerprich-hemmersdorf, right_type: manorial_lord, holder: erica-de-merfeld,
     reason: "the fief is a farm (cense) at Hemmersdorf, not the village (p. 82)"}
  - {place: kerprich-hemmersdorf, right_type: manorial_lord, holder: remacle-de-bockenheimer,
     reason: "the fief is rents at Hemmersdorf bought from the count of Sayn, not the village (p. 82)"}
  - {place: office-hombourg-haut, right_type: suzerain, holder: louis-de-guise,
     reason: "Louis de Guise held Hombourg as Lorraine's vassal from 1621 (homage to Charles IV, pp. 28-29); p. 65 is his appointment of a governor"}
  - {place: office-hombourg-haut, right_type: suzerain, holder: henriette-vaudemont,
     reason: "Henriette held Hombourg as Lorraine's vassal; p. 66 is her order to its bailli in 1632"}
  - {place: advocacy-saint-avold, right_type: advocate, holder: duchy-lorraine, share: 2/3,
     reason: "p. 66 splits the acorn dues of the vouerie (two thirds to the receipt of Hombourg, a third to Nassau as advocate); Lorraine was not advocate"}
  - {place: advocacy-saint-avold, right_type: advocate, holder: county-nassau-saarbruecken, share: 1/3,
     reason: "a third of the acorn dues (p. 66); Nassau's advocacy itself runs from 1302 (pp. 64, 102)"}

# Extracted memberships to discard; every given field must match (child, parent)
drop_memberships:
  - {child: lordship-marimont, parent: castellany-dieuze,
     reason: "the castellanies of Marimont and Dieuze are the two halves of the office of Dieuze (pp. 20, 74-75)"}
  - {child: chateau-salins, parent: office-dieuze,
     reason: "p. 83 sets Château-Salins (castellany of Amance, bailiwick of Nancy) against the offices of Dieuze and Marimont"}
  - {child: chateau-salins, parent: lordship-marimont,
     reason: "p. 83 sets Château-Salins (castellany of Amance, bailiwick of Nancy) against the offices of Dieuze and Marimont"}
  - {child: provostship-insming, parent: bailliage-allemagne,
     reason: "a provostship of the office of Dieuze (p. 74); p. 11 only names Insming among places"}
  - {child: provostship-ketternostern, parent: bailliage-allemagne,
     reason: "a provostship of the office of Schaumberg (p. 57); p. 10 only names it among places"}
  - {child: lordship-marimont, parent: bailliage-allemagne,
     reason: "l'ancienne châtellenie de Marimont, rattachée à celle de Dieuze (p. 74)"}
  - {child: gauhiving, parent: advocacy-saint-avold, reason: "in the vouerie only in 1365 and c.1429 (p. 67); a Landmairie of Forbach in 1623"}
  - {child: ditschviller, parent: advocacy-saint-avold, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: emmersweiler, parent: advocacy-saint-avold, reason: "in the vouerie only in 1365 and c.1429 (p. 67)"}
  - {child: guerting, parent: advocacy-saint-avold, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: remsing, parent: advocacy-saint-avold, reason: "in the vouerie only in 1365 (p. 67)"}
  - {child: sarreinsming, parent: lordship-forbach,
     reason: "only its castle is a rear-fief held of Forbach (p. 82); the village is a fief of the Sarreguemines castellany (p. 17)"}
  - {parent: ban-westrich,
     reason: "the Westrich of Münster's 1552 Cosmographia (p. 10) is a loose region, not a realm"}
  - {child: dordhal, parent: lordship-bourgaltroff,
     reason: "only formerly part of Bourgaltroff; a fief contested between Lorraine and the bishopric from 1577 (p. 146)"}
  - {child: remelfing-sierck, parent: lordship-hombourg-sur-canner,
     reason: "the lords of Hombourg-sur-Canner hold only a twelfth of Rémeling (p. 81); the village is ducal, office of Sierck"}
  - {child: harlingen, parent: office-schaumberg,
     reason: "one of Schaumberg's church lands (p. 14), not a village of the castellany: it lay in the advocacy of Merzig (pp. 14, 53-54)"}
  - {child: mondorf, parent: office-schaumberg,
     reason: "one of Schaumberg's church lands (p. 14), not a village of the castellany: it lay in the Saargau, partly in the office of Siersberg (pp. 14, 53)"}
  - {child: wehingen, parent: office-schaumberg,
     reason: "one of Schaumberg's fiefs (p. 14), not a village of the castellany: it lay in the Saargau (pp. 14, 53)"}
  # The mairies of the office of Dieuze sit in its two castellanies (pp. 20, 73-75).
  - {child: mayoralty-lindre, parent: office-dieuze, reason: "in the castellany of Dieuze (p. 20)"}
  - {child: mayoralty-cutting, parent: office-dieuze, reason: "in the old castellany of Marimont (p. 20)"}
  - {child: mayoralty-hellimer, parent: office-dieuze, reason: "in the old castellany of Marimont (p. 20)"}
  - {child: mayoralty-insming, parent: office-dieuze, reason: "in the old castellany of Marimont (p. 20)"}
  - {child: provostship-insming, parent: office-dieuze, reason: "in the old castellany of Marimont (p. 20)"}
  # The two mairies of the Saargau (p. 55) belong to that half of the condominium, not to Merzig.
  - {child: mayoralty-inferieure-du-saargau-a-schwemlingen, parent: condominium-merzig-saargau, reason: "a mairie of the Saargau (p. 55)"}
  - {child: mayoralty-superieure-du-saargau-a-hilbringen, parent: condominium-merzig-saargau, reason: "a mairie of the Saargau (p. 55)"}

# Corrections to extracted rights: rows matching every `match` field get the `set` fields.
right_overrides:
  - match: {place: honzrath, holder: teutonic-order}
    set: {holder_id: commandery-beckingen}
    reason: "the half of Honzrath went to the commander of Beckingen (p. 133)"
  - match: {place: berus, right_type: manorial_lord, holder: county-sulz}
    set: {share: "1/4"}
    reason: "Sulz and Anholt share one half through their wives, the Metternich the other (p. 80)"
  - match: {place: berus, right_type: manorial_lord, holder: county-anholt}
    set: {share: "1/4"}
    reason: "Sulz and Anholt share one half through their wives, the Metternich the other (p. 80)"

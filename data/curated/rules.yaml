  odenhofen: {approximate: oberdorf, note: "Odenhofen, a hamlet of Oberdorf near Bouzonville (index); was placed at Oberdorf in Alsace"}
  werdenstein: {approximate: hoppstetten, note: "the castle of Werdenstein with Hoppstetten, office of Schaumberg (p. 79)"}
  zell: {approximate: petit-tenquin, name_de: Zellen, name_en: Zellen,

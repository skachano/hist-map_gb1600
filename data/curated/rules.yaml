                          note: "Woelfling of the abbot of Bouzonville, office of Berus (p. 59); was matched to Wœlfling-lès-Sarreguemines"}
  eich-pirmasens: {lat: 49.2633, lon: 7.58306, name_de: Thaleischweiler, name_en: Thaleischweiler,

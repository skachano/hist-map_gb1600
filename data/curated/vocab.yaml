  pledge:       {en: pledge (engagement), fr: engagement, de: Verpfändung}
  redemption:   {en: redemption, fr: rachat, de: Pfandeinlösung}
  inheritance:  {en: inheritance, fr: héritage, de: Erbfall}
  enfeoffment:  {en: enfeoffment, fr: inféodation, de: Belehnung}
  exchange:     {en: exchange, fr: échange, de: Tausch}
  cession:      {en: cession, fr: cession, de: Abtretung}
  treaty:       {en: treaty / accommodation, fr: traité / accommodement, de: Vertrag / Vergleich}
  judgment:     {en: court judgment, fr: jugement, de: Urteil}
  occupation:   {en: military occupation, fr: occupation militaire, de: militärische Besetzung}
  confiscation: {en: confiscation, fr: confiscation, de: Konfiskation}
  boundary:     {en: boundary settlement, fr: abornement, de: Grenzregelung}

confidence:
  high:   {en: high, fr: élevée, de: hoch}
  medium: {en: medium, fr: moyenne, de: mittel}
  low:    {en: low, fr: faible, de: niedrig}

date_precisions:
  exact:    {en: exact, fr: exacte, de: genau}
  circa:    {en: circa, fr: vers, de: um}
  before:   {en: before, fr: avant, de: vor}
  after:    {en: after, fr: après, de: nach}

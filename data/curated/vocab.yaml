right_types:
  suzerain:
    en: Suzerainty (dominium directum)
    fr: Souveraineté (domaine direct)
    de: Oberherrschaft (dominium directum)
    ja: "宗主権（上級所有権）"
    desc:
      en: "The superior lordship (dominium directum): the prince of whom a land is held and whose sovereignty it is under. Its holder receives homage and fealty, and settles who may levy taxes and troops there."
      fr: "La seigneurie supérieure (domaine direct) : le prince dont une terre relève et sous la souveraineté duquel elle se trouve. Il reçoit foi et hommage et décide qui peut y lever impôts et troupes."
      de: "Die Oberherrschaft (dominium directum): der Fürst, von dem ein Land lehnsrührig ist und unter dessen Landeshoheit es steht. Er empfängt Huldigung und Lehnseid und bestimmt, wer dort Steuern und Truppen erheben darf."
      ja: "上級領主権（dominium directum）。土地がその者から封与され、その主権の下にある君主を指す。臣従礼と誠実宣誓を受け、そこで誰が税や兵を徴発できるかを定める。"
    core: true
  high_justice:
    en: High justice
    fr: Haute justice
    de: Hochgerichtsbarkeit
    ja: "上級裁判権"
    desc:
      en: "The right to judge crimes punishable by death or mutilation (blood justice). It is marked by the gallows (signe patibulaire) and usually goes with sovereignty."
      fr: "Le droit de juger les crimes passibles de mort ou de mutilation (justice de sang). Il se signale par le gibet (signe patibulaire) et accompagne en général la souveraineté."
      de: "Das Recht, Verbrechen zu richten, auf die Tod oder Verstümmelung stehen (Blutgericht). Sichtbares Zeichen ist der Galgen; es geht meist mit der Landeshoheit einher."
      ja: "死刑や身体刑に当たる犯罪を裁く権利（流血裁判権）。絞首台（signe patibulaire）がその印で、通常は主権と結びついていた。"
    core: true
  middle_low_justice:
    en: Middle and low justice
    fr: Moyenne et basse justice
    de: Nieder- und Mittelgerichtsbarkeit
    ja: "中級・下級裁判権"
    desc:
      en: "Jurisdiction over lesser offences punished by fines, and over civil matters such as debts, boundaries and property transfers. It was usually exercised by the village mayor and aldermen (maire and échevins) for the lord."
      fr: "La juridiction sur les délits punis d'amendes et sur les affaires civiles : dettes, bornages, mutations de biens. Elle était exercée en général par le maire et les échevins du village au nom du seigneur."
      de: "Die Gerichtsbarkeit über geringere, mit Geldbußen bestrafte Vergehen und über Zivilsachen wie Schulden, Grenzen und Besitzwechsel. Sie wurde meist von Meier und Schöffen des Dorfes im Namen des Herrn ausgeübt."
      ja: "罰金で罰せられる軽い違反と、債務・境界・財産移転などの民事を裁く権限。通常は村長と参審人（maire と échevins）が領主の名で行使した。"
  manorial_lord:
    en: Manorial lordship
    fr: Seigneurie foncière
    de: Grundherrschaft
    ja: "土地領主権"
    desc:
      en: "The seigneurie foncière: lordship over the land itself. It brings the rents, dues in kind, labour services (corvées) and banal rights (mill, oven, wine press) owed by the tenants."
      fr: "La seigneurie foncière : la seigneurie sur la terre elle-même. Elle donne droit aux cens, rentes en nature, corvées et banalités (moulin, four, pressoir) dus par les tenanciers."
      de: "Die Grundherrschaft: die Herrschaft über den Boden selbst. Zu ihr gehören Zinsen, Naturalabgaben, Frondienste und Bannrechte (Mühle, Backofen, Kelter) der Hintersassen."
      ja: "土地そのものに対する領主権（seigneurie foncière）。保有農が負う地代、現物納付、賦役、独占使用権（水車・パン窯・葡萄圧搾機）をもたらす。"
    core: true
  advocate:
    en: Advocacy
    fr: Avouerie (vouerie)
    de: Vogtei
    ja: "教会守護権（フォークト権）"
    desc:
      en: "The advocate (voué, Vogt) protected the lands of a church or abbey and exercised their temporal justice, in return for dues. An example is the counts of Nassau as advocates of the abbey of Saint-Nabor at Saint-Avold."
      fr: "Le voué (Vogt) protégeait les terres d'une église ou d'une abbaye et y exerçait la justice temporelle, contre redevances. Par exemple, les comtes de Nassau étaient voués de l'abbaye de Saint-Nabor à Saint-Avold."
      de: "Der Vogt schützte die Güter einer Kirche oder Abtei und übte dort die weltliche Gerichtsbarkeit aus, gegen Abgaben. So waren die Grafen von Nassau Vögte der Abtei St. Nabor in St. Avold."
      ja: "教会や修道院の所領を保護し、その世俗裁判権を行使した守護者（voué, Vogt）の権利。貢租と引き換えだった。例：サン＝タヴォルのサン＝ナボール修道院の守護者としてのナッサウ伯。"
    core: true
  spiritual_lord:
    en: Diocesan authority
    fr: Autorité diocésaine
    de: Diözesangewalt
    ja: "司教区の管轄"
    desc:
      en: "The bishop in whose diocese a place lay (Metz, Trier or Strasbourg). This is church jurisdiction over clergy, parishes and matters such as marriage, not temporal lordship."
      fr: "L'évêque dans le diocèse duquel se trouvait un lieu (Metz, Trèves ou Strasbourg). Il s'agit de la juridiction ecclésiastique sur le clergé, les paroisses et des matières comme le mariage, non d'une seigneurie temporelle."
      de: "Der Bischof, in dessen Diözese ein Ort lag (Metz, Trier oder Straßburg). Gemeint ist die kirchliche Gerichtsbarkeit über Geistliche, Pfarreien und Fragen wie die Ehe, nicht eine weltliche Herrschaft."
      ja: "その地が属した司教区（メス、トリーア、ストラスブール）の司教。聖職者、小教区、婚姻などに及ぶ教会の裁治権であり、世俗の領主権ではない。"
    core: true
  tithe:
    en: Tithe
    fr: Dîme
    de: Zehnt
    ja: "十分の一税"
    desc:
      en: "The tenth of the harvest owed to the church. It was often held by abbeys, chapters or lay lords rather than by the parish priest."
      fr: "Le dixième de la récolte dû à l'Église. Il était souvent détenu par des abbayes, des chapitres ou des seigneurs laïcs plutôt que par le curé."
      de: "Der zehnte Teil der Ernte, der der Kirche zustand. Er lag oft bei Abteien, Stiften oder weltlichen Herren statt beim Pfarrer."
      ja: "収穫の十分の一として教会に納められた税。しばしば主任司祭ではなく、修道院・参事会・世俗領主が保有した。"
  safeguard:
    en: Safeguard (protection)
    fr: Sauvegarde
    de: Schirmherrschaft
    ja: "保護権"
    desc:
      en: "Protection (sauvegarde, Schirm) granted by a prince over a place or an institution, usually for a yearly due. It could become a foothold for later claims to sovereignty."
      fr: "La protection accordée par un prince à un lieu ou à une institution, en général contre une redevance annuelle. Elle pouvait servir d'appui à des prétentions ultérieures à la souveraineté."
      de: "Der Schutz (Schirm), den ein Fürst einem Ort oder einer Einrichtung gewährte, meist gegen eine jährliche Abgabe. Er konnte zum Ansatzpunkt späterer Ansprüche auf die Landeshoheit werden."
      ja: "君主が土地や施設に与えた保護（sauvegarde, Schirm）。通常は年ごとの貢租と引き換えだった。のちの主権主張の足掛かりになることもあった。"
  tax_aide:
    en: General aid (tax)
    fr: Aide générale
    de: Landsteuer (Beihilfe)
    ja: "一般援助金（租税）"
    desc:
      en: "Taxes levied on the inhabitants: the general aid (aide générale) voted by the Estates of Lorraine, and imperial taxes such as the Landfried or the Turkish aid. Who levied them shows whose subjects the inhabitants were counted as."
      fr: "Les impôts levés sur les habitants : l'aide générale votée par les États de Lorraine, et les impôts d'Empire comme le Landfried ou l'aide contre les Turcs. Qui les levait montre de qui les habitants étaient comptés sujets."
      de: "Die von den Einwohnern erhobenen Steuern: die von den lothringischen Ständen bewilligte allgemeine Beihilfe und Reichssteuern wie Landfriedensgeld oder Türkenhilfe. Wer sie erhob, zeigt, wessen Untertanen die Einwohner galten."
      ja: "住民に課された税：ロレーヌ身分制議会が承認した一般援助金（aide générale）と、ラントフリーデ税やトルコ援助金などの帝国税。誰が徴収したかで、住民が誰の臣民とみなされたかがわかる。"
  military:
    en: Military levy (musters)
    fr: Monstres (levée militaire)
    de: Musterung (Wehrhoheit)
    ja: "軍事召集権"
    desc:
      en: "The right to muster the inhabitants for military service (monstres), to raise troops there and to garrison or arm the place."
      fr: "Le droit de passer en revue les habitants pour le service militaire (monstres), d'y lever des troupes et de mettre le lieu en défense ou d'y tenir garnison."
      de: "Das Recht, die Einwohner zum Kriegsdienst zu mustern, dort Truppen auszuheben und den Ort zu befestigen oder zu besetzen."
      ja: "住民を軍務のために点呼（monstres）し、兵を徴募し、その地を防備・駐屯させる権利。"
  tabellionage:
    en: Notarial office
    fr: Tabellionage
    de: Tabellionat (Notariat)
    ja: "公証人任命権"
    desc:
      en: "The right to appoint the tabellions, the public notaries who drew up and registered contracts, sales and other deeds."
      fr: "Le droit de nommer les tabellions, notaires publics qui rédigeaient et enregistraient contrats, ventes et autres actes."
      de: "Das Recht, die Tabellionen zu ernennen, die öffentlichen Notare, die Verträge, Verkäufe und andere Urkunden aufsetzten und verzeichneten."
      ja: "契約・売買などの証書を作成・登録した公証人（tabellion）を任命する権利。"
  appeal_jurisdiction:
    en: Court of appeal
    fr: Juridiction d'appel
    de: Appellationsinstanz
    ja: "上訴裁判所"
    desc:
      en: "The court to which judgments could be appealed. Examples are the Change of Nancy, the bailiwick's Assises and, for imperial lands, the Imperial Chamber Court."
      fr: "La cour à laquelle on pouvait appeler des jugements, par exemple le Change de Nancy, les Assises du bailliage ou, pour les terres d'Empire, la Chambre impériale."
      de: "Das Gericht, an das man gegen Urteile appellieren konnte, etwa der Change in Nancy, die Assisen des Bellistums oder für Reichsgebiete das Reichskammergericht."
      ja: "判決に対して上訴できた裁判所。例：ナンシーのシャンジュ、バイイ管区のアシーズ、帝国領については帝室裁判所。"


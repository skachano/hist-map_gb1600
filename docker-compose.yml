services:
  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: hist-map-pipeline
    environment:
      HOME: /tmp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - .:/work
    working_dir: /work/pipeline

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: hist-map-web
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
    volumes:
      - ./web:/work/web
    ports:
      - "5173:5173"

  # Headless Chromium for screenshots and end-to-end tests (Stage 8/10). The image
  # version must match the playwright package in web/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      HOME: /tmp
      APP_URL: http://web:5173
    volumes:
      - ./web:/work/web
    working_dir: /work/web
    depends_on:
      - web
